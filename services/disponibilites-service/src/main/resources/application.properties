spring.application.name=disponibilites-service
server.port=8000

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hotel_db}?currentSchema=${DB_SCHEMA:disponibilites}
spring.datasource.username=${DB_USER:disponibilites_user}
spring.datasource.password=${DB_PASSWORD:disponibilites_pass}
spring.jpa.hibernate.ddl-auto=update
spring.jackson.property-naming-strategy=SNAKE_CASE
