server {
    listen 8000;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Autoriser jusqu'à 50 Mo de payload (pour l'envoi de plusieurs images Base64)
    client_max_body_size 50M;

    # Toutes les requÃªtes passent par index.php (Laravel)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    # DÃ©sactiver l'accÃ¨s aux fichiers cachÃ©s
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
