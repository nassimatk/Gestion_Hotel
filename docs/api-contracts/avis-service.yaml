
openapi: 3.0.3

info:
  title: avis-service
  version: 1.0.0
  description: >
    Microservice de gestion des avis clients de l'hôtel HotelHub.
    Permet de créer, consulter, modifier et supprimer les avis.
    Communique avec Auth Service pour vérifier les utilisateurs
    et avec Chambres Service pour vérifier les chambres.
    Chaque microservice conserve sa propre base de données.

servers:
  - url: http://localhost:8002/api
    description: Développement local (Docker)

tags:
  - name: Monitoring
    description: Vérification de l'état du service
  - name: Avis
    description: Gestion des avis clients

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    Avis:
      type: object
      properties:
        id:
          type: integer
          example: 1
        chambre_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 2
        note:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        commentaire:
          type: string
          example: "Très belle chambre, propre et confortable."
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        user:
          nullable: true
          description: Informations récupérées depuis Auth Service.
          allOf:
            - $ref: '#/components/schemas/UserInfo'

    UserInfo:
      type: object
      nullable: true
      properties:
        id:
          type: integer
          example: 2
        name:
          type: string
          example: "Ahmed"

    AvisInput:
      type: object
      required:
        - chambre_id
        - note
        - commentaire
      properties:
        chambre_id:
          type: integer
          minimum: 1
          example: 1
          description: Identifiant de la chambre vérifié auprès de Chambres Service.
        note:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        commentaire:
          type: string
          minLength: 3
          maxLength: 2000
          example: "Très bonne chambre et excellent service."

    AvisUpdate:
      type: object
      minProperties: 1
      properties:
        chambre_id:
          type: integer
          minimum: 1
          example: 1
        note:
          type: integer
          minimum: 1
          maximum: 5
          example: 4
        commentaire:
          type: string
          minLength: 3
          maxLength: 2000
          example: "Chambre confortable et bien entretenue."

    AvisCreatedResponse:
      type: object
      properties:
        message:
          type: string
          example: "Avis créé avec succès."
        data:
          $ref: '#/components/schemas/Avis'

    AvisResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Avis'

    AvisListResponse:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        data:
          type: array
          items:
            $ref: '#/components/schemas/Avis'
        first_page_url:
          type: string
          nullable: true
        from:
          type: integer
          nullable: true
        last_page:
          type: integer
          example: 3
        last_page_url:
          type: string
          nullable: true
        links:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                nullable: true
              label:
                type: string
              active:
                type: boolean
        next_page_url:
          type: string
          nullable: true
        path:
          type: string
        per_page:
          type: integer
          example: 10
        prev_page_url:
          type: string
          nullable: true
        to:
          type: integer
          nullable: true
        total:
          type: integer
          example: 25

    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: "Avis modifié avec succès."

    Error:
      type: object
      properties:
        message:
          type: string
          example: "Une erreur est survenue."
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

paths:

  /health:
    get:
      summary: État du service
      tags:
        - Monitoring
      responses:
        "200":
          description: Service opérationnel
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: avis-service
                  version:
                    type: string
                    example: "1.0.0"

  /avis:
    get:
      summary: Récupérer la liste des avis
      description: >
        Retourne les avis avec pagination de 10 éléments.
        Les informations du client sont récupérées auprès d'Auth Service.
        Un filtre chambre_id permet de récupérer les avis d'une chambre précise.
        La chambre est vérifiée auprès de Chambres Service lorsque ce filtre est utilisé.
      tags:
        - Avis
      parameters:
        - name: chambre_id
          in: query
          required: false
          description: Filtrer les avis par identifiant de chambre.
          schema:
            type: integer
            minimum: 1
            example: 1
        - name: page
          in: query
          required: false
          description: Numéro de la page.
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: Liste des avis récupérée avec succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvisListResponse'
        "404":
          description: Chambre introuvable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "422":
          description: Paramètres invalides.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: Chambres Service inaccessible ou erreur de communication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Ajouter un avis
      description: >
        Crée un avis pour une chambre.
        L'utilisateur est identifié à partir du JWT.
        Auth Service vérifie l'existence de l'utilisateur.
        Chambres Service vérifie l'existence de la chambre.
        Le user_id ne peut pas être fourni par le client.
      tags:
        - Avis
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvisInput'
      responses:
        "201":
          description: Avis créé avec succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvisCreatedResponse'
        "401":
          description: Utilisateur non authentifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Utilisateur ou chambre introuvable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "422":
          description: Données envoyées invalides.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: Auth Service ou Chambres Service inaccessible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /avis/{avi}:
    parameters:
      - name: avi
        in: path
        required: true
        description: Identifiant de l'avis.
        schema:
          type: integer
          example: 1

    get:
      summary: Consulter un avis
      description: >
        Retourne un avis précis avec les informations du client
        récupérées auprès d'Auth Service.
        Vérifie également l'existence de la chambre auprès de Chambres Service.
      tags:
        - Avis
      responses:
        "200":
          description: Avis trouvé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvisResponse'
        "404":
          description: Avis ou chambre introuvable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: Chambres Service inaccessible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Modifier un avis
      description: >
        Seul le propriétaire de l'avis peut le modifier.
        Si chambre_id est modifié, son existence est vérifiée
        auprès de Chambres Service.
      tags:
        - Avis
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvisUpdate'
      responses:
        "200":
          description: Avis modifié avec succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvisCreatedResponse'
        "401":
          description: Utilisateur non authentifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: L'utilisateur n'est pas propriétaire de cet avis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Avis ou nouvelle chambre introuvable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "422":
          description: Données envoyées invalides.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: Chambres Service inaccessible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Modifier partiellement un avis
      description: >
        Même fonctionnement que PUT.
        Seul le propriétaire de l'avis peut le modifier.
      tags:
        - Avis
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvisUpdate'
      responses:
        "200":
          description: Avis modifié avec succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvisCreatedResponse'
        "401":
          description: Utilisateur non authentifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: L'utilisateur n'est pas propriétaire de cet avis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Avis ou nouvelle chambre introuvable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "422":
          description: Données envoyées invalides.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: Chambres Service inaccessible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Supprimer un avis
      description: >
        Le propriétaire peut supprimer son propre avis.
        Un administrateur peut supprimer tous les avis.
      tags:
        - Avis
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Avis supprimé avec succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        "401":
          description: Utilisateur non authentifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "403":
          description: Suppression non autorisée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Avis introuvable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
