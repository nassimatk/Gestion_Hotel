openapi: 3.0.3
info:
  title: disponibilites-service
  version: 0.1.0
  description: |
    Disponibilite des chambres par date et gestion des reservations.
    Port hote 8003, port conteneur 8000. Schema Postgres: disponibilites.
    Les details d'une chambre viennent de chambres-service, le prix de tarifs-service.
    Droits: GET /api/disponibilites/** public; POST /api/reservations et
    DELETE /api/reservations/{id} pour un utilisateur connecte (client ou admin,
    annulation reservee au proprietaire ou a l'admin); GET /api/reservations admin.
    A valider avec l'equipe: POST /api/reservations ouvert aux clients (exception a la
    regle 'ecriture = admin' de conventions.md).
servers:
  - url: http://localhost:8003
    description: Depuis la machine hote
  - url: http://disponibilites-service:8000
    description: Depuis un autre conteneur Docker

tags:
  - name: Sante
  - name: Disponibilites
  - name: Reservations

paths:
  /api/health:
    get:
      tags: [Sante]
      summary: Le service est-il vivant
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/disponibilites/chambres/{id}:
    get:
      tags: [Disponibilites]
      summary: Une chambre est-elle libre sur une periode
      parameters:
        - $ref: "#/components/parameters/ChambreId"
        - $ref: "#/components/parameters/DateDebut"
        - $ref: "#/components/parameters/DateFin"
      responses:
        "200":
          description: Disponibilite de la chambre
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisponibiliteChambre"
        "400":
          $ref: "#/components/responses/Erreur400"
        "404":
          $ref: "#/components/responses/Erreur404"
        "503":
          $ref: "#/components/responses/Erreur503"

  /api/reservations:
    post:
      tags: [Reservations]
      summary: Creer une reservation
      description: Le client_id est lu dans le claim sub du JWT.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationCreation"
      responses:
        "201":
          description: Reservation creee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          $ref: "#/components/responses/Erreur400"
        "401":
          $ref: "#/components/responses/Erreur401"
        "403":
          $ref: "#/components/responses/Erreur403"
        "404":
          $ref: "#/components/responses/Erreur404"
        "409":
          $ref: "#/components/responses/Erreur409"
        "503":
          $ref: "#/components/responses/Erreur503"
    get:
      tags: [Reservations]
      summary: Toutes les reservations (admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Liste des reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"
        "401":
          $ref: "#/components/responses/Erreur401"
        "403":
          $ref: "#/components/responses/Erreur403"

  /api/reservations/mes:
    get:
      tags: [Reservations]
      summary: Reservations du client connecte
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Liste des reservations du client
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"
        "401":
          $ref: "#/components/responses/Erreur401"

  /api/reservations/{id}:
    delete:
      tags: [Reservations]
      summary: Annuler une reservation (statut ANNULEE)
      description: Reserve au proprietaire de la reservation ou a un admin.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Reservation annulee
        "401":
          $ref: "#/components/responses/Erreur401"
        "403":
          $ref: "#/components/responses/Erreur403"
        "404":
          $ref: "#/components/responses/Erreur404"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT HS256 emis par auth-service (claims sub, role, exp)

  parameters:
    DateDebut:
      name: date_debut
      in: query
      required: true
      description: Date d'arrivee (ISO 8601)
      schema:
        type: string
        format: date
        example: "2026-11-01"
    DateFin:
      name: date_fin
      in: query
      required: true
      description: Date de depart (ISO 8601), doit etre apres date_debut
      schema:
        type: string
        format: date
        example: "2026-11-05"
    ChambreId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    DisponibiliteChambre:
      type: object
      properties:
        chambre_id:
          type: integer
          format: int64
          example: 1
        disponible:
          type: boolean
          example: true
        date_debut:
          type: string
          format: date
        date_fin:
          type: string
          format: date
        prix:
          type: number
          nullable: true
          example: 500
    ReservationCreation:
      type: object
      required: [chambre_id, date_debut, date_fin]
      properties:
        chambre_id:
          type: integer
          format: int64
          example: 1
        date_debut:
          type: string
          format: date
          example: "2026-11-01"
        date_fin:
          type: string
          format: date
          example: "2026-11-05"
    Reservation:
      type: object
      properties:
        id:
          type: integer
          format: int64
        chambre_id:
          type: integer
          format: int64
        client_id:
          type: integer
          format: int64
        date_debut:
          type: string
          format: date
        date_fin:
          type: string
          format: date
        statut:
          type: string
          enum: [CONFIRMEE, ANNULEE]
        created_at:
          type: string
          format: date-time
    Erreur:
      type: object
      properties:
        error:
          type: string
        code:
          type: integer

  responses:
    Erreur400:
      description: Requete invalide (dates incorrectes)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erreur"
          example:
            error: date_fin doit etre apres date_debut
            code: 400
    Erreur401:
      description: Token absent ou invalide
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erreur"
          example:
            error: Token manquant ou invalide
            code: 401
    Erreur403:
      description: Role insuffisant
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erreur"
          example:
            error: Acces refuse
            code: 403
    Erreur404:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erreur"
          example:
            error: Chambre introuvable
            code: 404
    Erreur409:
      description: Chambre deja reservee sur cette periode
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erreur"
          example:
            error: Chambre deja reservee sur cette periode
            code: 409
    Erreur503:
      description: chambres-service indisponible
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erreur"
          example:
            error: Service chambres indisponible
            code: 503
