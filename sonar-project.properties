
# ==========================================
# PROJECT IDENTIFICATION
# ==========================================
sonar.projectKey=HotelHub
sonar.projectName=HotelHub
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# ==========================================
# SONARQUBE SERVER
# ==========================================
sonar.host.url=http://localhost:9000

# ==========================================
# SOURCE CODE
# ==========================================
sonar.sources=services,frontend/src

# ==========================================
# GLOBAL EXCLUSIONS
# ==========================================
sonar.exclusions=\
  **/vendor/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/target/**,\
  **/storage/**,\
  **/bootstrap/cache/**,\
  **/tests/**,\
  **/src/test/**,\
  **/composer.lock,\
  **/package-lock.json,\
  **/.env,\
  **/.env.*

# ==========================================
# LARAVEL - PHP
# ==========================================
sonar.php.file.suffixes=.php

# ==========================================
# SPRING BOOT - JAVA
# ==========================================
sonar.java.binaries=services/disponibilites-service/target/classes
