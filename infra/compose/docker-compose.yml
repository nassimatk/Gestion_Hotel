# Depuis la racine du projet :
#   docker compose --env-file .env -f infra/compose/docker-compose.yml up --build
name: hotelhub

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hotel_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d hotel_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [hotelhub]

  # ===== pgadmin (Interface web d'administration PostgreSQL) =====
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@hotelhub.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin_secret}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ../pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [hotelhub]

  # ===== auth-service =====
  auth-service:
    build: ../../services/auth-service
    ports: ["8005:8000"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hotel_db
      DB_USER: auth_user
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      DB_SCHEMA: auth
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [hotelhub]

  # ===== chambres-service =====
  chambres-service:
    build: ../../services/chambres-service
    ports: ["8001:8000"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hotel_db
      DB_USER: chambres_user
      DB_PASSWORD: ${CHAMBRES_DB_PASSWORD}
      DB_SCHEMA: chambres
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [hotelhub]

  # ===== avis-service =====
  avis-service:
    build: ../../services/avis-service
    ports: ["8002:8000"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hotel_db
      DB_USER: avis_user
      DB_PASSWORD: ${AVIS_DB_PASSWORD}
      DB_SCHEMA: avis
      JWT_SECRET: ${JWT_SECRET}
      CHAMBRES_SERVICE_URL: http://chambres-service:8000/api
      CHAMBRES_MOCK: ${CHAMBRES_MOCK:-false}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [hotelhub]

  # ===== disponibilites-service =====
  disponibilites-service:
    build: ../../services/disponibilites-service
    ports: ["8003:8000"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hotel_db
      DB_USER: disponibilites_user
      DB_PASSWORD: ${DISPONIBILITES_DB_PASSWORD}
      DB_SCHEMA: disponibilites
      JWT_SECRET: ${JWT_SECRET}
      CHAMBRES_SERVICE_URL: http://chambres-service:8000/api
    depends_on:
      postgres: { condition: service_healthy }
    networks: [hotelhub]

  # ===== tarifs-service =====
  tarifs-service:
    build: ../../services/tarifs-service
    ports: ["8004:8000"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hotel_db
      DB_USER: tarifs_user
      DB_PASSWORD: ${TARIFS_DB_PASSWORD}
      DB_SCHEMA: tarifs
      JWT_SECRET: ${JWT_SECRET}
      CHAMBRES_SERVICE_URL: http://chambres-service:8000/api
    depends_on:
      postgres: { condition: service_healthy }
    networks: [hotelhub]

  # ===== frontend =====
  frontend:
    build: ../../frontend
    ports: ["3000:80"]
    networks: [hotelhub]

volumes:
  pgdata:
  pgadmin_data:

networks:
  hotelhub:
